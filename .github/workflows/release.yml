name: Release Advanced Mermaid

permissions:
    contents: read

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - name: Install and validate source
              run: |
                  npm ci
                  npm test
                  npm run typecheck
                  npm run lint
                  npm run check:public
                  npm run check:history
            - name: Run browser fixtures
              run: |
                  npx playwright install --with-deps chromium
                  mkdir -p test-results
                  npm run test:browser
              env:
                  ADVANCED_MERMAID_BROWSER: chromium
            - name: Build and validate release
              run: |
                  npm run build
                  npm run check:release -- --tag "$GITHUB_REF_NAME"
            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "$GITHUB_REF_NAME" \
                    --verify-tag \
                    --title="Advanced Mermaid $GITHUB_REF_NAME" \
                    --draft \
                    main.js manifest.json styles.css
